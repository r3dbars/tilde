name: Proof fast

# Pre-merge gate for pull requests targeting main.
# Runs `./script/proof.sh fast`: swift test, test-coverage manifest,
# proof manifest, and whitespace check.
#
# Note: check_test_coverage_manifest.sh is currently red on main due to
# 7 orphaned HostCompatibilityPolicy public types being fixed in a separate
# thread. This workflow will surface that known failure until that fix lands.
#
# The Python/bash script self-tests are handled separately in
# script-self-tests.yml (Ubuntu, no Swift toolchain required).
on:
  pull_request:
    branches: [main]

jobs:
  proof-fast:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Run proof fast
        run: bash script/proof.sh fast
