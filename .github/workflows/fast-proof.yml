name: Fast proof gate

# Single fast pre-merge tier: script/proof.sh fast — whitespace, python
# byte-compile, the latency/quality harness self-tests, and the core Swift test
# suite. The Swift + MLX package graph needs macOS + Apple Silicon, so the Linux
# job sets PROOF_SKIP_SWIFT=1 and the macOS job requires Swift. One gate, one
# source of truth: developers run the same script locally (pre-push hook).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fast-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so a PR can diff against its base for git diff --check.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fast proof tier (script/proof.sh fast)
        run: bash script/proof.sh fast
        env:
          # The Swift suite needs macOS + Apple Silicon + the MLX runtime, and
          # even the core filter has to resolve the MLX-laden package graph, so
          # skip it on the Linux runner (it has a swift toolchain, but can't run
          # this package). Swift still runs locally and in the pre-push hook.
          PROOF_SKIP_SWIFT: "1"
          # On a PR, also flag whitespace / conflict markers the PR introduces.
          # Empty on push events -> proof.sh checks the working tree instead.
          PROOF_DIFF_BASE: ${{ github.event.pull_request.base.sha }}

  fast-proof-macos:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so a PR can diff against its base for git diff --check.
          fetch-depth: 0

      - name: Select newest Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build
          # .build contains the patched dependency checkout. Keep this exact so a
          # changed patch or patch script can never restore already-patched stale code.
          key: macos-26-swiftpm-${{ hashFiles('Package.resolved', 'patches/mlx-swift-lm/**', 'script/patch_mlx_swift_lm.sh') }}

      - name: Resolve Swift package graph
        run: swift package resolve

      - name: Patch resolved MLX Swift LM dependency
        run: ./script/patch_mlx_swift_lm.sh

      - name: Fast proof tier with Swift tests (script/proof.sh fast)
        run: bash script/proof.sh fast
        env:
          # This lane exists to exercise Swift. Never allow proof.sh's generic
          # no-toolchain fallback to turn the Swift test into a successful skip.
          PROOF_REQUIRE_SWIFT: "1"
          # On a PR, also flag whitespace / conflict markers the PR introduces.
          # Empty on push events -> proof.sh checks the working tree instead.
          PROOF_DIFF_BASE: ${{ github.event.pull_request.base.sha }}
