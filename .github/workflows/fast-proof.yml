name: Fast proof gate

on:
  pull_request:
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Assets/**"
      - "script/**"
      - "Package.swift"
      - "Package.resolved"
      - ".github/workflows/fast-proof.yml"
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Assets/**"
      - "script/**"
      - "Package.swift"
      - "Package.resolved"
      - ".github/workflows/fast-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-proof:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain
        run: swift --version

      - name: Full proof
        run: bash script/proof.sh fast
        env:
          PROOF_DIFF_BASE: origin/main
