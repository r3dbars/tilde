name: Fast proof gate

# Single fast pre-merge tier: script/proof.sh fast. These are the cheap proof
# checks that must stay green on main (the kind of red that has been landing
# unguarded: a stale coverage manifest, broken scripts, whitespace). The Swift +
# MLX suite needs macOS + Apple Silicon, so this job sets PROOF_SKIP_SWIFT=1; the
# Linux-friendly checks (coverage manifest, byte-compile, harness self-tests,
# whitespace, and the report-only proof manifest) run on every PR to main.
#
# This replaces the old "Script self-tests" workflow: its byte-compile and
# self-test steps now live inside proof.sh, so the gate has a single source of
# truth that developers run locally too (script/proof.sh fast, pre-push hook).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fast-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so a PR can diff against its base for git diff --check.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fast proof tier (script/proof.sh fast)
        run: bash script/proof.sh fast
        env:
          # The Swift suite needs macOS + Apple Silicon + the MLX runtime, and
          # even the core filter has to resolve the MLX-laden package graph, so
          # skip it on the Linux runner (it has a swift toolchain, but can't run
          # this package). Swift still runs locally and in the pre-push hook.
          PROOF_SKIP_SWIFT: "1"
          # On a PR, also flag whitespace / conflict markers the PR introduces.
          # Empty on push events -> proof.sh checks the working tree instead.
          PROOF_DIFF_BASE: ${{ github.event.pull_request.base.sha }}

  fast-proof-macos:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so a PR can diff against its base for git diff --check.
          fetch-depth: 0

      - name: Select newest Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build
          key: macos-26-swiftpm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            macos-26-swiftpm-

      - name: Resolve Swift package graph
        run: swift package resolve

      - name: Patch resolved MLX Swift LM dependency
        run: ./script/patch_mlx_swift_lm.sh

      - name: Fast proof tier with Swift tests (script/proof.sh fast)
        run: bash script/proof.sh fast
        env:
          # On a PR, also flag whitespace / conflict markers the PR introduces.
          # Empty on push events -> proof.sh checks the working tree instead.
          PROOF_DIFF_BASE: ${{ github.event.pull_request.base.sha }}
