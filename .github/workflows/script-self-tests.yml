name: Script self-tests

# The Swift suite needs macOS + the MLX runtime, so it is not run here. This
# workflow guards the privacy-first Python/bash automation in script/ that can
# run on Linux: it byte-compiles every script and runs the harness self-tests
# that do not require an installed model or the Swift toolchain.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  script-self-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Byte-compile all scripts
        run: python3 -m py_compile script/*.py

      - name: Local completion runtime self-test
        run: bash script/local_completion_runtime_self_test.sh

      - name: Local completion batch self-test
        run: bash script/local_completion_batch_self_test.sh

      - name: First-token latency self-test
        run: bash script/first_token_latency_self_test.sh

      - name: Local quality audit self-test
        run: bash script/check_local_quality_audit_self_test.sh

      - name: Small model blind audit report check
        run: bash script/check_small_model_blind_audit_report.sh
