name: Tilde bug report
description: Report an autocomplete or app compatibility problem without sharing private text.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not paste typed text, prompts, model output, screenshots, document names, URLs, recipients, or subject lines. Use disposable example text.
  - type: input
    id: build
    attributes:
      label: Tilde build
      description: Version, commit, or artifact checksum.
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Mac and macOS
      placeholder: "Apple Silicon model, macOS 26.x"
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: Host app
      description: App name and version.
      placeholder: "TextEdit, Notes, Obsidian, browser and version, or other editor"
    validations:
      required: true
  - type: dropdown
    id: input-source
    attributes:
      label: Tilde input source state
      options:
        - Enabled and selected
        - Enabled but not selected
        - Missing from Input Sources
        - Not sure
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Use a disposable document and safe placeholder text.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private writing and screenshots from this report.
          required: true
