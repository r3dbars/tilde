name: Autocomplete Lab beta feedback
description: Report a private beta issue without sharing private typed text.
title: "[Beta] "
labels:
  - beta feedback
body:
  - type: markdown
    attributes:
      value: |
        Do not paste raw typed text, prompts, screenshots, document names, URLs, recipients, or subject lines.
  - type: input
    id: build
    attributes:
      label: Build
      description: Version, build number, commit, or artifact checksum.
      placeholder: "commit 771f14d, AutocompleteLab.dmg sha256 ..."
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS and hardware
      placeholder: "macOS 26.x, Apple Silicon, memory size"
    validations:
      required: true
  - type: dropdown
    id: target-app
    attributes:
      label: Target app
      options:
        - TextEdit
        - Apple Notes title
        - Apple Notes body
        - Apple Notes checklist
        - Obsidian
        - Chrome textarea
        - Chrome contenteditable
        - Codex
        - Claude Code
        - Claude desktop
        - Other
    validations:
      required: true
  - type: dropdown
    id: permission-state
    attributes:
      label: Accessibility permission state
      options:
        - Granted
        - Denied
        - Reset during test
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Trust blocker: wrong insertion, submit, secure-field leak, data loss
        - High: repeated interruption or broken core flow
        - Medium: confusing or annoying behavior
        - Low: docs, copy, or polish
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe the behavior without private text.
      placeholder: "Tab should accept one word and not submit."
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Describe what happened without private text.
      placeholder: "The suggestion disappeared before Tab."
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Use safe labels like "short disposable sentence" instead of private content.
      placeholder: |
        1. Open TextEdit disposable document.
        2. Type a short disposable sentence.
        3. Press Tab.
    validations:
      required: true
  - type: dropdown
    id: diagnostics-consent
    attributes:
      label: Redacted diagnostics attached?
      options:
        - Yes, redacted export only
        - No
        - I can provide it if requested
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Do not include private text.
